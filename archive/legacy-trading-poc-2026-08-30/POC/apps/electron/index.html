<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic Trading</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="workbench" data-testid="workbench.root">
      <header class="topbar" data-testid="workbench.topAppBar">
        <div class="mac-lights" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="app-title">Agentic Trading</div>
        <div class="topbar-row">
          <div class="mode-group" data-testid="workbench.workspaceMode"></div>
          <div class="status-strip"></div>
          <div class="top-actions" aria-label="Actions">
            <form class="symbol-search" data-testid="workbench.symbolSearch">
              <input name="symbol" aria-label="Symbol" autocomplete="off" placeholder="Enter symbol" />
              <button type="submit" title="Load live symbol">Load</button>
            </form>
            <button type="button" data-action="refresh" title="Refresh live data">↻</button>
            <button type="button" data-action="help" title="Help">?</button>
            <button type="button" data-action="settings" title="Settings">⚙</button>
          </div>
        </div>
      </header>

      <section class="main-grid">
        <aside class="left-rail" data-testid="workbench.leftRail">
          <div class="rail-section">
            <div class="section-header"><span>Watchlist</span><button type="button" data-action="add-watchlist" title="Add symbol">+</button></div>
            <select aria-label="Watchlist">
              <option>Local Watchlist</option>
            </select>
            <div class="watchlist"></div>
          </div>
          <div class="rail-section captures">
            <div class="section-header"><span>Activity</span><button type="button" data-action="clear-activity" title="Clear activity">×</button></div>
            <div class="capture-list"></div>
          </div>
          <div class="account-card">
            <div class="avatar">TR</div>
            <div>
              <strong>trader.research</strong>
              <span>No broker account connected</span>
            </div>
          </div>
        </aside>

        <section class="market-workspace" data-testid="workbench.marketWorkspace">
          <div class="quote-header">
            <div class="symbol-block">
              <div><span class="symbol"></span><span class="star">★</span><span class="info">ⓘ</span></div>
              <span class="company"></span>
            </div>
            <div class="price-block">
              <strong class="last-price"></strong>
              <span class="price-change"></span>
            </div>
            <div class="quote-metrics"></div>
          </div>
          <div class="chart-toolbar">
            <div class="timeframes"></div>
            <div class="tool-cluster">
              <button title="Indicators">ƒx Indicators</button>
              <button title="Draw">Draw</button>
              <button title="Add">+</button>
              <button title="Fullscreen">⛶</button>
            </div>
          </div>
          <div class="chart-shell">
            <canvas id="priceChart" width="960" height="430" aria-label="Candlestick chart"></canvas>
          </div>
          <div class="range-row">
            <button type="button" data-range="1D">1D</button><button type="button" data-range="5D">5D</button><button type="button" data-range="1M">1M</button><button type="button" data-range="3M">3M</button><button type="button" data-range="6M">6M</button><button type="button" data-range="YTD">YTD</button><button type="button" data-range="1Y">1Y</button><button type="button" data-range="5Y">5Y</button><button type="button" data-range="All">All</button>
            <span class="clock">--</span><button type="button" data-chart-toggle="percent">%</button><button type="button" data-chart-toggle="log">log</button><button type="button" data-chart-toggle="auto">auto</button>
          </div>
          <section class="bottom-dock" data-testid="workbench.bottomDock">
            <div class="dock-tabs"></div>
            <div class="dock-content"></div>
          </section>
        </section>

        <aside class="right-panel" data-testid="workbench.rightPanel">
          <div class="right-tabs"></div>
          <section class="ticket-panel"></section>
          <footer class="decision-footer">
            <button type="button" class="live-button" disabled>Live 🔒<span>Disabled in Live Review</span></button>
            <button type="button" class="paper-button" data-action="review-paper" data-testid="workbench.reviewPaperAction">Review Paper<span>Simulate &amp; Audit</span></button>
          </footer>
        </aside>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
