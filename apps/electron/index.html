<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic Trading</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="workbench" data-testid="workbench.root">
      <header class="topbar" data-testid="workbench.topAppBar">
        <div class="mac-lights" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="app-title">Agentic Trading</div>
        <div class="topbar-row">
          <div class="mode-group" data-testid="workbench.workspaceMode"></div>
          <div class="status-strip"></div>
          <div class="top-actions" aria-label="Actions">
            <button title="Search">⌕</button>
            <button title="Help">?</button>
            <button title="Settings">⚙</button>
          </div>
        </div>
      </header>

      <section class="main-grid">
        <aside class="left-rail" data-testid="workbench.leftRail">
          <div class="rail-section">
            <div class="section-header"><span>Watchlists</span><button title="Add watchlist">+</button></div>
            <select aria-label="Watchlist">
              <option>Tech Leaders</option>
              <option>Volatility Watch</option>
            </select>
            <div class="watchlist"></div>
          </div>
          <div class="rail-section captures">
            <div class="section-header"><span>Saved Captures</span><button title="Add capture">+</button></div>
            <div class="capture-list"></div>
          </div>
          <div class="account-card">
            <div class="avatar">TR</div>
            <div>
              <strong>trader.research</strong>
              <span>Paper · $250,000.00</span>
            </div>
          </div>
        </aside>

        <section class="market-workspace" data-testid="workbench.marketWorkspace">
          <div class="quote-header">
            <div class="symbol-block">
              <div><span class="symbol"></span><span class="star">★</span><span class="info">ⓘ</span></div>
              <span class="company"></span>
            </div>
            <div class="price-block">
              <strong class="last-price"></strong>
              <span class="price-change"></span>
            </div>
            <div class="quote-metrics"></div>
          </div>
          <div class="chart-toolbar">
            <div class="timeframes"></div>
            <div class="tool-cluster">
              <button title="Indicators">ƒx Indicators</button>
              <button title="Draw">Draw</button>
              <button title="Add">+</button>
              <button title="Fullscreen">⛶</button>
            </div>
          </div>
          <div class="chart-shell">
            <canvas id="priceChart" width="960" height="430" aria-label="Candlestick chart"></canvas>
          </div>
          <div class="range-row">
            <span>1D</span><span>5D</span><span>1M</span><span>3M</span><span>6M</span><span>YTD</span><span>1Y</span><span>5Y</span><span>All</span>
            <span class="clock">10:51:38 ET</span><span>%</span><span>log</span><span>auto</span>
          </div>
          <section class="bottom-dock" data-testid="workbench.bottomDock">
            <div class="dock-tabs"></div>
            <div class="dock-content"></div>
          </section>
        </section>

        <aside class="right-panel" data-testid="workbench.rightPanel">
          <div class="right-tabs"></div>
          <section class="ticket-panel"></section>
          <footer class="decision-footer">
            <button class="live-button" disabled>Live 🔒<span>Disabled in Live Review</span></button>
            <button class="paper-button" data-testid="workbench.reviewPaperAction">Review Paper<span>Simulate &amp; Audit</span></button>
          </footer>
        </aside>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
